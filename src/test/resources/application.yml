spring:
  datasource:
    url: jdbc:h2:mem:aijobtest;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password: test-only-h2-password
    driver-class-name: org.h2.Driver

# This file shadows src/main/resources/application.yml, so production MyBatis
# settings have to be repeated here or column mapping differs from production.
mybatis:
  configuration:
    map-underscore-to-camel-case: true

jwt:
  secret: test-only-jwt-secret-key-must-be-32b!!
  expiration: 3600000

openai:
  api-key: test-openai-key-not-real
  model: gpt-4o

server:
  forward-headers-strategy: framework

aijob:
  storage:
    root: target/aijob-test-uploads
  cors:
    allowed-origins: http://localhost:5173,http://127.0.0.1:5173
