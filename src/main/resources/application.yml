spring:
  application:
    name: aijob

  datasource:
    url: ${AIJOB_DB_URL}
    username: ${AIJOB_DB_USERNAME}
    password: ${AIJOB_DB_PASSWORD}

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

mybatis:
  configuration:
    map-underscore-to-camel-case: true

jwt:
  secret: ${AIJOB_JWT_SECRET}
  expiration: ${AIJOB_JWT_EXPIRATION:86400000}

openai:
  api-key: ${OPENAI_API_KEY}
  model: ${OPENAI_MODEL:gpt-4o}

pdf:
  export:
    soffice-path: C:/LibreOffice/program/soffice.exe
    timeout-seconds: 60

aijob:
  storage:
    root: ${AIJOB_STORAGE_ROOT:uploads}
