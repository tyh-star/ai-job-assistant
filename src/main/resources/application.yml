spring:
  application:
    name: aijob

  datasource:
    url: ${AIJOB_DB_URL}
    username: ${AIJOB_DB_USERNAME}
    password: ${AIJOB_DB_PASSWORD}
    hikari:
      # Explicit so the collector container can be given a smaller share of the
      # MySQL connections than the API. 10 is Hikari's own default.
      maximum-pool-size: ${AIJOB_DB_POOL_MAX:10}
      data-source-properties:
        # TIMESTAMP columns are instants. Pin the session to UTC so LocalDateTime
        # written as UTC wall time round-trips as the same instant after JDBC.
        connectionTimeZone: UTC
        forceConnectionTimeZoneToSession: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

mybatis:
  configuration:
    map-underscore-to-camel-case: true

jwt:
  secret: ${AIJOB_JWT_SECRET}
  expiration: ${AIJOB_JWT_EXPIRATION:86400000}

openai:
  api-key: ${OPENAI_API_KEY}
  model: ${OPENAI_MODEL:gpt-4o}

# Resume Rewrite (简历改写): Groq's OpenAI-compatible API. The key only comes from the
# server environment; without it the rewrite endpoints answer 503 AI_NOT_CONFIGURED.
aijob.rewrite:
  base-url: ${AI_BASE_URL:https://api.groq.com/openai/v1}
  api-key: ${GROQ_API_KEY:}
  free-model: ${AI_FREE_MODEL:openai/gpt-oss-20b}
  pro-model: ${AI_PRO_MODEL:openai/gpt-oss-120b}
  timeout-seconds: ${AI_TIMEOUT_SECONDS:60}

pdf:
  export:
    soffice-path: C:/LibreOffice/program/soffice.exe
    timeout-seconds: 60

server:
  forward-headers-strategy: ${SERVER_FORWARD_HEADERS_STRATEGY:framework}

aijob:
  storage:
    root: ${AIJOB_STORAGE_ROOT:uploads}
  cors:
    allowed-origins: ${AIJOB_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  # Which JobCatalogService backs /api/v1/job-catalog/** — the search, detail and save
  # routes the website's Jobs page actually calls.
  #   freehire      (default) every search/detail/save calls FreeHire's own hosted API
  #                 (freehire.me/api/v1). Nothing is collected or mirrored locally.
  #   local_catalog explicit opt-in: reads only this deployment's own job_catalog table,
  #                 built by the self-hosted collector below. Switching to this does NOT
  #                 turn collection back on by itself — see aijob.collector.enabled.
  job-catalog:
    provider: ${JOB_CATALOG_PROVIDER:freehire}
  freehire:
    user-agent: ${FREEHIRE_USER_AGENT:ai-job-assistant/1.0}
    connect-timeout-seconds: ${FREEHIRE_CONNECT_TIMEOUT_SECONDS:5}
    read-timeout-seconds: ${FREEHIRE_READ_TIMEOUT_SECONDS:10}
    # A page of full-description search results, generously bounded -- never large
    # enough to mirror FreeHire's catalog by paging through it.
    max-response-bytes: ${FREEHIRE_MAX_RESPONSE_BYTES:5242880}
    # Backend-wide, not per user: this is a fairness cap on OUR OWN egress, separate
    # from FreeHire's own IP-keyed rate limit (300/min on /agent/jobs/search).
    max-concurrent-requests: ${FREEHIRE_MAX_CONCURRENT_REQUESTS:5}
    # A real per-MINUTE request budget, backend-wide (shared by every user, not a
    # per-user allotment) -- distinct from max-concurrent-requests above, which only
    # bounds requests in flight at once and says nothing about volume over a minute.
    # See FreeHireRateLimiter's javadoc. Process-local: correct as the effective global
    # budget only while production runs a single backend instance (true today) --
    # scaling to multiple instances needs a shared limiter or a divided budget.
    rate-limit:
      # Below FreeHire's own confirmed 300/min limit on /agent/jobs/search, on purpose --
      # a safety margin, not a value budgeted right up to their ceiling.
      search-per-minute: ${FREEHIRE_SEARCH_RATE_LIMIT_PER_MINUTE:180}
      # FreeHire has not published a separate number for GET /jobs/{slug}; this is a
      # deliberately conservative UNCONFIRMED default, not a documented limit.
      read-per-minute: ${FREEHIRE_READ_RATE_LIMIT_PER_MINUTE:120}
  # Background ATS collection. Only the `collector` profile schedules anything, and
  # collection stays off until an operator sets JOB_COLLECTOR_ENABLED=true.
  collector:
    enabled: ${JOB_COLLECTOR_ENABLED:false}
    interval-minutes: ${JOB_COLLECTOR_INTERVAL_MINUTES:120}
    initial-delay-minutes: ${JOB_COLLECTOR_INITIAL_DELAY_MINUTES:1}
    max-concurrency: ${JOB_COLLECTOR_MAX_CONCURRENCY:2}
    batch-size: ${JOB_COLLECTOR_BATCH_SIZE:100}
    expiry-grace-hours: ${JOB_EXPIRY_GRACE_HOURS:72}
    user-agent: ${JOB_COLLECTOR_USER_AGENT:AiJobAssistantCollector/1.0}
    contact-email: ${JOB_COLLECTOR_CONTACT_EMAIL:}
    request-timeout-seconds: ${JOB_COLLECTOR_REQUEST_TIMEOUT_SECONDS:20}
    max-retries: ${JOB_COLLECTOR_MAX_RETRIES:3}
    max-jobs-per-source: ${JOB_COLLECTOR_MAX_JOBS_PER_SOURCE:2000}
    max-description-chars: ${JOB_COLLECTOR_MAX_DESCRIPTION_CHARS:100000}
    max-raw-payload-chars: ${JOB_COLLECTOR_MAX_RAW_PAYLOAD_CHARS:200000}
    raw-payload-retention-days: ${JOB_COLLECTOR_RAW_PAYLOAD_RETENTION_DAYS:30}
    run-history-retention-days: ${JOB_COLLECTOR_RUN_HISTORY_RETENTION_DAYS:30}
    heartbeat-file: ${JOB_COLLECTOR_HEARTBEAT_FILE:/tmp/aijob-collector-heartbeat}
    # How long one process may hold a source's collection lease before another
    # process may take it over. Longer than any realistic run, but finite so a killed
    # container cannot block a board forever.
    lock-timeout-minutes: ${JOB_COLLECTOR_LOCK_TIMEOUT_MINUTES:60}
