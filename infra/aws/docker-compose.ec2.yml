services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=256M
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent",
        ]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 30s

  backend:
    # Explicitly tagged so a release can keep the previous image addressable. Set
    # AIJOB_BACKEND_IMAGE to a recorded rollback tag and start with --no-build to go
    # back to a known-good build instead of rebuilding over it.
    image: ${AIJOB_BACKEND_IMAGE:-aijob-backend:current}
    build:
      context: ../..
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      AIJOB_DB_URL: ${AIJOB_DB_URL}
      AIJOB_DB_USERNAME: ${AIJOB_DB_USERNAME}
      AIJOB_DB_PASSWORD: ${AIJOB_DB_PASSWORD}
      AIJOB_JWT_SECRET: ${AIJOB_JWT_SECRET}
      AIJOB_JWT_EXPIRATION: ${AIJOB_JWT_EXPIRATION:-86400000}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o}
      JSEARCH_API_KEY: ${JSEARCH_API_KEY}
      JSEARCH_API_BASE_URL: ${JSEARCH_API_BASE_URL:-https://api.openwebninja.com}
      JOB_SEARCH_PRIMARY_PROVIDER: ${JOB_SEARCH_PRIMARY_PROVIDER:-JSEARCH}
      JSEARCH_MAX_PAGES_PER_SEARCH: ${JSEARCH_MAX_PAGES_PER_SEARCH:-10}
      # Public Jobs page reads FreeHire; do not flip this to local_catalog unless the
      # self-hosted collector is intentionally in use. Default matches application.yml.
      JOB_CATALOG_PROVIDER: ${JOB_CATALOG_PROVIDER:-freehire}
      AIJOB_STORAGE_ROOT: ${AIJOB_STORAGE_ROOT:-/data/uploads}
      AIJOB_TAILOR_ENGINE: ${AIJOB_TAILOR_ENGINE:-V3}
      PDF_EXPORT_SOFFICE_PATH: ${PDF_EXPORT_SOFFICE_PATH:-/usr/bin/soffice}
      PDF_EXPORT_TIMEOUT_SECONDS: ${PDF_EXPORT_TIMEOUT_SECONDS:-60}
      AIJOB_CORS_ALLOWED_ORIGINS: ${AIJOB_CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      SERVER_FORWARD_HEADERS_STRATEGY: ${SERVER_FORWARD_HEADERS_STRATEGY:-framework}
    volumes:
      - uploads_data:/data/uploads
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "code=$$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{}' http://127.0.0.1:8080/api/v1/auth/login); echo $$code | grep -qE '^(400|401|403|405|415)$$'",
        ]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s

  # Background ATS collection. No published port; reachable only on the compose
  # network. Collection itself stays off until JOB_COLLECTOR_ENABLED=true, and the
  # container still reports healthy while idle.
  collector:
    image: ${AIJOB_COLLECTOR_IMAGE:-aijob-collector:current}
    build:
      context: ../..
      dockerfile: Dockerfile.collector
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    # Database credentials only. The collector signs no token, calls no model and
    # calls no job-search API, so the production JWT, OpenAI and JSearch secrets are
    # deliberately NOT passed in here -- application-collector.yml supplies inert
    # collector-only placeholders for the shared beans that demand a value.
    # This shrinks what a compromised collector could leak; it is not full component
    # isolation, because those beans are still constructed in the context.
    environment:
      AIJOB_DB_URL: ${AIJOB_DB_URL}
      AIJOB_DB_USERNAME: ${AIJOB_DB_USERNAME}
      AIJOB_DB_PASSWORD: ${AIJOB_DB_PASSWORD}
      JOB_COLLECTOR_ENABLED: ${JOB_COLLECTOR_ENABLED:-false}
      JOB_COLLECTOR_LOCK_TIMEOUT_MINUTES: ${JOB_COLLECTOR_LOCK_TIMEOUT_MINUTES:-60}
      JOB_COLLECTOR_INTERVAL_MINUTES: ${JOB_COLLECTOR_INTERVAL_MINUTES:-120}
      JOB_COLLECTOR_INITIAL_DELAY_MINUTES: ${JOB_COLLECTOR_INITIAL_DELAY_MINUTES:-1}
      JOB_COLLECTOR_MAX_CONCURRENCY: ${JOB_COLLECTOR_MAX_CONCURRENCY:-2}
      JOB_COLLECTOR_BATCH_SIZE: ${JOB_COLLECTOR_BATCH_SIZE:-100}
      JOB_EXPIRY_GRACE_HOURS: ${JOB_EXPIRY_GRACE_HOURS:-72}
      JOB_COLLECTOR_USER_AGENT: ${JOB_COLLECTOR_USER_AGENT:-AiJobAssistantCollector/1.0}
      JOB_COLLECTOR_CONTACT_EMAIL: ${JOB_COLLECTOR_CONTACT_EMAIL:-}
      JOB_COLLECTOR_REQUEST_TIMEOUT_SECONDS: ${JOB_COLLECTOR_REQUEST_TIMEOUT_SECONDS:-20}
      JOB_COLLECTOR_MAX_RETRIES: ${JOB_COLLECTOR_MAX_RETRIES:-3}
      JOB_COLLECTOR_MAX_JOBS_PER_SOURCE: ${JOB_COLLECTOR_MAX_JOBS_PER_SOURCE:-2000}
      JOB_COLLECTOR_MAX_DESCRIPTION_CHARS: ${JOB_COLLECTOR_MAX_DESCRIPTION_CHARS:-100000}
      JOB_COLLECTOR_MAX_RAW_PAYLOAD_CHARS: ${JOB_COLLECTOR_MAX_RAW_PAYLOAD_CHARS:-200000}
      JOB_COLLECTOR_RAW_PAYLOAD_RETENTION_DAYS: ${JOB_COLLECTOR_RAW_PAYLOAD_RETENTION_DAYS:-30}
      JOB_COLLECTOR_RUN_HISTORY_RETENTION_DAYS: ${JOB_COLLECTOR_RUN_HISTORY_RETENTION_DAYS:-30}
      AIJOB_DB_POOL_MAX: ${JOB_COLLECTOR_DB_POOL_MAX:-3}
    healthcheck:
      # The scheduler rewrites the heartbeat once a minute after proving it can reach
      # MySQL, so a stale file means the collector is wedged even if the JVM is up.
      test:
        [
          "CMD-SHELL",
          "test $$(( $$(date +%s) - $$(stat -c %Y /var/run/aijob/collector-heartbeat) )) -lt 180",
        ]
      interval: 30s
      timeout: 5s
      retries: 4
      start_period: 90s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512M

  web:
    # The catalog search page lives in this image, so a rollback of the API without a
    # rollback of the web image leaves users on a UI that no longer matches the
    # backend. Keep the pair addressable.
    image: ${AIJOB_WEB_IMAGE:-aijob-web:current}
    build:
      context: ../..
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST}
      CADDY_ACME_EMAIL: ${CADDY_ACME_EMAIL:-}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  mysql_data:
  uploads_data:
  caddy_data:
  caddy_config:
