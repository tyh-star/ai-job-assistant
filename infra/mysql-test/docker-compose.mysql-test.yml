# An isolated MySQL 8.4 used ONLY by JobExportImportMySqlIntegrationTest.
#
# Everything here is deliberately separate from the machine's existing MySQL 8.0 on
# 3306 and from the production stack in infra/aws:
#
#   * a different port, bound to loopback only
#   * its own Compose project name (pass -p aijob-mysqltest; see README)
#   * its own named volume, created empty by this file
#   * its own database and account, neither of which exists anywhere else
#
# It mounts no host directory and no existing volume, so there is no path by which it
# can read or write the data of any other database on this machine.
#
# Start it with:
#   docker compose -p aijob-mysqltest \
#     --env-file infra/mysql-test/.env.mysql-test \
#     -f infra/mysql-test/docker-compose.mysql-test.yml up -d
services:
  mysql-test:
    image: mysql:8.4
    restart: "no" # a scratch database: it should not come back on its own after a reboot
    ports:
      # 127.0.0.1 is load-bearing, not decoration. Without it Docker publishes on
      # 0.0.0.0 and a throwaway database with a known name is reachable from the
      # network. Nothing outside this machine needs to reach it.
      - "127.0.0.1:${AIJOB_MYSQL_TEST_PORT:-3307}:3306"
    environment:
      # Both passwords come from .env.mysql-test, which is generated locally, git-ignored,
      # and readable only by the current user. Neither is written in this file.
      MYSQL_ROOT_PASSWORD: ${AIJOB_MYSQL_TEST_ROOT_PASSWORD:?set it by running new-credentials.ps1}
      MYSQL_DATABASE: aijob_import_test
      MYSQL_USER: aijob_test
      MYSQL_PASSWORD: ${AIJOB_MYSQL_TEST_PASSWORD:?set it by running new-credentials.ps1}
    command:
      # Match the production charset and collation exactly. The collation is the whole
      # point of one of the tests: job_source_records is utf8mb4_unicode_ci, which is
      # case-INSENSITIVE, and whether that folds two external ids differing only in case
      # is a question only a real MySQL can answer. A test server on a different
      # collation would answer a different question.
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      # Small: this holds at most a few hundred synthetic postings.
      - --innodb-buffer-pool-size=128M
    volumes:
      - mysqltest_data:/var/lib/mysql
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 30s

volumes:
  # Created empty by Compose under the aijob-mysqltest project, so it becomes
  # aijob-mysqltest_mysqltest_data and cannot collide with the production
  # aijob_mysql_data.
  mysqltest_data:
